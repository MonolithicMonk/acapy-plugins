[tool.poetry]
name = "traction_innkeeper"
version = "0.1.0"
description = ""
authors = ["Jason Sherman <tools@usingtechnolo.gy>"]
license = "Apache-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
acapy-agent = { git = "https://github.com/MonolithicMonk/aries-cloudagent-python.git", branch = "dacapy", optional = true }
python-dateutil = "^2.9.0"
bcrypt = "^4.2.1"
mergedeep = "^1.3.4"
typing-extensions = "4.12.2"
anoncreds = "^0.2.0"
multitenant-provider = { git = "https://github.com/MonolithicMonk/acapy-plugins.git", branch = "dacapy", subdirectory = "multitenant_provider" }
connections = { git = "https://github.com/MonolithicMonk/acapy-plugins.git", branch = "dacapy", subdirectory = "connections" }

aries-askar = { version = "~0.4.3" }
indy-credx = { version = "~1.1.1" }
indy-vdr = { version = "~0.4.2" }
python3-indy = { version = "^1.11.1" }

[tool.poetry.dev-dependencies]
black = "^25.1.0"
flake8 = "^7.1.2"
ruff = "^0.9.6"

[build-system]
requires = ["setuptools", "poetry-core>=1.2"]
build-backend = "poetry.core.masonry.api"